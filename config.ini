; ============================================
; XMAPort 配置文件
; 改完保存请保持 ANSI/GBK 编码，程序按 GBK 读取
; ============================================

; 目标设备代号（如 peridot, fuxi, sheng 等）
target_device=peridot

; 目标设备平台：Qualcomm / MTK，必须按真实设备如实填写
; 填错会走错 vendor 处理分支（MTK 重打包 / 高通直复制），可能无法开机
device_platform=Qualcomm

[source]
; 源 ROM（要移植出去的系统）官方完整卡刷包直链 zip
; 只能填直链，不能 fastboot 包、不能 ultimateota 开头的链接
; 留空 = 不下载，直接复用上次工作区里的源包数据
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.0.9.XPCMIXM/pudding_global-ota_full-OS4.0.0.9.XPCMIXM-user-17.0-4fe981b89f.zip

[target]
; 底包 ROM（目标设备的官方完整卡刷包）直链 zip，提供 odm / vendor 等分区
; 留空 = 不下载，直接复用上次工作区里的底包数据
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.303.0.WNPMIXM/peridot_global-ota_full-OS3.0.303.0.WNPMIXM-user-16.0-9eb06ac062.zip

[settings]
; 下载设置（aria2c）
; 下载分块线程数（aria2 -s）
threads=16

; 单服务器最大连接数（aria2 -x）
; 国内 aria2 建议设 16，避免被限速；国外根据网络情况调整
max-connection=16

; 超时时间（秒）
timeout=300

; 失败重试次数（每个包独立重试，0 = 不重试直接报错）
retry=5

[packing]
; ============================================
; 打包格式
; ============================================
; 分区镜像格式：erofs / ext4，需与目标设备底包 ROM 保持一致
format=erofs

; 是否自动打包为 super.img
; false 模式下可在主菜单 [A] 命令执行器 -> 1 随时手动合成
pack_super=true

; 是否输出 sparse 格式镜像（刷机包必须为 true）
sparse=true

; 文件时间戳（留空 = 自动使用当前 UTC 时间）
utc_stamp=

; erofs 压缩算法与级别（常用 lz4hc + 8，数值越高越小越耗时）
compression=lz4hc
compression_level=8

; true = 使用旧内核兼容参数（mkfs.erofs -E legacy-compress）
; 较新的设备不需要，新设备填 false
erofs_old_kernel=false

; ============================================
; super 动态分区设置（按目标设备实际填写，填错无法开机或刷入报错）
; ============================================
; super 分区总大小（字节）：peridot 实际物理容量为 8.5GB (9126805504 字节)
device_size=9126805504

; metadata 大小（字节）
metadata_size=65536

; metadata 槽位数（A/B 设备一般为 3）
metadata_slots=3

; 是否启用 Virtual A/B
virtual_ab=true

; super 分区名称
super_name=super

; 动态分区组名称：高通一般为 qti_dynamic_partitions，MTK 一般为 main
super_group=qti_dynamic_partitions

; ============================================
; 高级选项
; ============================================
; true  = 跳过 system_ext 重新打包，直接从源镜像复制（快；APEX 同步会自动降级旧工具处理）
; false = 重新打包 system_ext，同步 APEX 补全
is_skip_apex=false

; true = 在 odm build.prop 注入 adb/root 调试属性（ro.secure=0 等）
; 方便移植后抓取开机日志与排错
enable_adb_debug=true

; true = 修改 vbmeta 关闭 AVB 校验（刷机包通用需要）
patch_vbmeta=true

; ============================================
; Build Prop Patch List（按需增减属性，所列 prop 将追加到目标 odm/etc/build.prop）
; 如需清空 prop 追加，将本行到下一个 [section] 之间全部删除即可
; 谨慎增减属性
; ============================================
; patch build prop list
####################################
# from device/xiaomi/mivendor/common_rw.prop
####################################
# For common rw override property
#support night charge property
persist.vendor.night.charge=true
####################################
# from device/xiaomi/zero/odm/special_rw.prop
####################################
#support accelerate charge property
persist.vendor.accelerate.charge=true
#support battery health
persist.vendor.battery.health=true
#enable extreme battery
persist.vendor.extreme.mode=true
#support high temp dialog
persist.vendor.hightemp.notice=true
#support smart charge engine
persist.vendor.smartchg=854
#camera wechat beauty
persist.vendor.vcb.ability=true
persist.vendor.vcb.enable=false
ro.vendor.cabc.enable=false
ro.vendor.bcbc.enable=true
ro.vendor.dfps.enable=false
ro.vendor.fps.switch.default=true
ro.vendor.gcp.enable=1
ro.vendor.display.default_fps=120
ro.vendor.sre.enable=true
ro.vendor.localhbm.enable=true
ro.vendor.video_box.version=2
